openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API de la plateforme de recrutement MRS & CORLAY
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: companies
  - name: campaigns
  - name: questions
  - name: candidates
  - name: invitations
  - name: assessments
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /companies:
    get:
      operationId: listCompanies
      tags: [companies]
      summary: List companies available to the signed-in user
      responses:
        "200":
          description: Companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard totals and recent recruitment activity
      parameters:
        - name: companyId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List recruitment campaigns
      parameters:
        - name: companyId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CampaignStatus"
      responses:
        "200":
          description: Campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a recruitment campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Created campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
  /campaigns/{campaignId}:
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Update campaign details and status
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignUpdate"
      responses:
        "200":
          description: Updated campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "404":
          description: Campaign not found
  /questions:
    get:
      operationId: listQuestions
      tags: [questions]
      summary: List reusable assessment questions
      parameters:
        - name: companyId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Question"
    post:
      operationId: createQuestion
      tags: [questions]
      summary: Add a question to the question bank
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionInput"
      responses:
        "201":
          description: Created question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
  /campaigns/{campaignId}/candidates:
    get:
      operationId: listCampaignCandidates
      tags: [candidates]
      summary: List candidates and current assessment statuses
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Candidates in a campaign
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Candidate"
    post:
      operationId: createCampaignCandidate
      tags: [candidates]
      summary: Add a candidate to a campaign
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateInput"
      responses:
        "201":
          description: Created candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
  /campaigns/{campaignId}/invitations:
    post:
      operationId: createInvitations
      tags: [invitations]
      summary: Generate personal invitation links for campaign candidates
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201":
          description: Created invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"
  /campaigns/{campaignId}/rankings:
    get:
      operationId: getCampaignRankings
      tags: [candidates]
      summary: Get validated rankings, top candidates, and eligible candidates
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Campaign rankings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rankings"
  /attempts/{attemptId}/review:
    get:
      operationId: getAttemptReview
      tags: [candidates]
      summary: Get candidate answers and grading information
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Attempt to review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptReview"
        "404":
          description: Attempt not found
  /attempts/{attemptId}/grades:
    put:
      operationId: saveAttemptGrades
      tags: [candidates]
      summary: Save manual grades and optionally validate the correction
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeInput"
      responses:
        "200":
          description: Updated attempt grades
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GradeSummary"
  /public/invitations/{token}:
    get:
      operationId: getPublicInvitation
      tags: [assessments]
      summary: Read candidate-facing invitation details using its unguessable token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public invitation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicInvitation"
        "404":
          description: Invalid, expired, or revoked invitation
  /public/invitations/{token}/start:
    post:
      operationId: startAssessment
      tags: [assessments]
      summary: Start a timed assessment using a valid personal invitation
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityCheck"
      responses:
        "200":
          description: Assessment attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentAttempt"
  /public/attempts/{attemptId}/answers/{questionId}:
    put:
      operationId: saveAnswer
      tags: [assessments]
      summary: Save an answer progressively before the server-side deadline
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
        - name: questionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerInput"
      responses:
        "200":
          description: Saved answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedAnswer"
  /public/attempts/{attemptId}/submit:
    post:
      operationId: submitAssessment
      tags: [assessments]
      summary: Submit an assessment once, voluntarily or after its deadline
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Submission confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    CampaignStatus:
      type: string
      enum: [draft, published, in_progress, closed, archived]
    CandidateStatus:
      type: string
      enum: [added, invited, in_progress, submitted, submitted_automatically, to_review, reviewed, shortlisted, interview_scheduled, rejected]
    Company:
      type: object
      required: [id, name, code]
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string }
        accentColor: { type: string }
        logoUrl: { type: ["string", "null"] }
    Dashboard:
      type: object
      required: [activeCampaigns, invitedCandidates, testsInProgress, awaitingReview, shortlisted, recentCampaigns]
      properties:
        activeCampaigns: { type: integer }
        invitedCandidates: { type: integer }
        testsInProgress: { type: integer }
        awaitingReview: { type: integer }
        shortlisted: { type: integer }
        recentCampaigns:
          type: array
          items: { $ref: "#/components/schemas/Campaign" }
    Campaign:
      type: object
      required: [id, companyId, companyName, title, reference, description, status, durationMinutes, passingScore, shortlistSize, questionIds, questionCount, candidateCount, startedCount, submittedCount, reviewCount, createdAt]
      properties:
        id: { type: string }
        companyId: { type: string }
        companyName: { type: string }
        title: { type: string }
        reference: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/CampaignStatus" }
        durationMinutes: { type: integer }
        passingScore: { type: number }
        shortlistSize: { type: integer }
        questionIds: { type: array, items: { type: string } }
        questionCount: { type: integer }
        opensAt: { type: ["string", "null"], format: date-time }
        closesAt: { type: ["string", "null"], format: date-time }
        candidateCount: { type: integer }
        startedCount: { type: integer }
        submittedCount: { type: integer }
        reviewCount: { type: integer }
        createdAt: { type: string, format: date-time }
    CampaignInput:
      type: object
      required: [companyId, title, reference, description, durationMinutes, passingScore, shortlistSize]
      properties:
        companyId: { type: string }
        title: { type: string, minLength: 2 }
        reference: { type: string, minLength: 1 }
        description: { type: string }
        durationMinutes: { type: integer, minimum: 1, maximum: 480 }
        passingScore: { type: number, minimum: 0, maximum: 100 }
        shortlistSize: { type: integer, minimum: 1, maximum: 100 }
        questionIds: { type: array, items: { type: string } }
        opensAt: { type: ["string", "null"], format: date-time }
        closesAt: { type: ["string", "null"], format: date-time }
        status: { $ref: "#/components/schemas/CampaignStatus" }
    CampaignUpdate:
      type: object
      properties:
        title: { type: string, minLength: 2 }
        reference: { type: string, minLength: 1 }
        description: { type: string }
        durationMinutes: { type: integer, minimum: 1, maximum: 480 }
        passingScore: { type: number, minimum: 0, maximum: 100 }
        shortlistSize: { type: integer, minimum: 1, maximum: 100 }
        questionIds: { type: array, items: { type: string } }
        opensAt: { type: ["string", "null"], format: date-time }
        closesAt: { type: ["string", "null"], format: date-time }
        status: { $ref: "#/components/schemas/CampaignStatus" }
    Question:
      type: object
      required: [id, prompt, kind, points, required, category, competency, difficulty]
      properties:
        id: { type: string }
        prompt: { type: string }
        kind: { type: string, enum: [single_choice, multiple_choice, true_false, short_text, long_text, numeric] }
        points: { type: number }
        required: { type: boolean }
        category: { type: string }
        competency: { type: string }
        difficulty: { type: string, enum: [easy, medium, hard] }
        choices: { type: array, items: { type: string } }
        expectedAnswer: { type: ["string", "null"] }
        maxCharacters: { type: ["integer", "null"] }
    QuestionInput:
      type: object
      required: [prompt, kind, points, required, category, competency, difficulty]
      properties:
        companyId: { type: ["string", "null"] }
        prompt: { type: string, minLength: 3 }
        kind: { type: string, enum: [single_choice, multiple_choice, true_false, short_text, long_text, numeric] }
        points: { type: number, minimum: 0 }
        required: { type: boolean }
        category: { type: string }
        competency: { type: string }
        difficulty: { type: string, enum: [easy, medium, hard] }
        choices: { type: array, items: { type: string } }
        expectedAnswer: { type: ["string", "null"] }
        maxCharacters: { type: ["integer", "null"], minimum: 1 }
    Candidate:
      type: object
      required: [id, firstName, lastName, email, companyId, campaignId, status, invitedAt, attemptId]
      properties:
        id: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        phone: { type: ["string", "null"] }
        companyId: { type: string }
        campaignId: { type: string }
        status: { $ref: "#/components/schemas/CandidateStatus" }
        score: { type: ["number", "null"] }
        invitedAt: { type: ["string", "null"], format: date-time }
        attemptId: { type: ["string", "null"] }
    CandidateInput:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        email: { type: string, format: email }
        phone: { type: ["string", "null"] }
    InvitationInput:
      type: object
      required: [candidateIds]
      properties:
        candidateIds:
          type: array
          minItems: 1
          items: { type: string }
    Invitation:
      type: object
      required: [candidateId, candidateName, email, status, url]
      properties:
        candidateId: { type: string }
        candidateName: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [ready, sent, failed] }
        url: { type: string }
    Rankings:
      type: object
      required: [campaignId, topCandidates, eligibleCandidates]
      properties:
        campaignId: { type: string }
        topCandidates:
          type: array
          items: { $ref: "#/components/schemas/RankedCandidate" }
        eligibleCandidates:
          type: array
          items: { $ref: "#/components/schemas/RankedCandidate" }
    RankedCandidate:
      type: object
      required: [candidateId, name, score, rank, status]
      properties:
        candidateId: { type: string }
        name: { type: string }
        score: { type: number }
        rank: { type: integer }
        status: { type: string }
    AttemptReview:
      type: object
      required: [attemptId, candidateId, candidateName, campaignId, submittedAt, submissionType, questions, validated]
      properties:
        attemptId: { type: string }
        candidateId: { type: string }
        candidateName: { type: string }
        campaignId: { type: string }
        submittedAt: { type: string, format: date-time }
        submissionType: { type: string, enum: [voluntary, automatic] }
        questions:
          type: array
          items: { $ref: "#/components/schemas/ReviewQuestion" }
        validated: { type: boolean }
        totalScore: { type: ["number", "null"] }
    ReviewQuestion:
      type: object
      required: [id, prompt, kind, points, required, answer, score, comment, competency]
      properties:
        id: { type: string }
        prompt: { type: string }
        kind: { type: string }
        points: { type: number }
        required: { type: boolean }
        answer: { type: ["string", "null"] }
        expectedAnswer: { type: ["string", "null"] }
        score: { type: ["number", "null"] }
        comment: { type: string }
        competency: { type: string }
    GradeInput:
      type: object
      required: [grades, validate]
      properties:
        validate: { type: boolean }
        grades:
          type: array
          items:
            $ref: "#/components/schemas/GradeItem"
    GradeItem:
      type: object
      required: [questionId, score]
      properties:
        questionId: { type: string }
        score: { type: number, minimum: 0 }
        comment: { type: string }
    GradeSummary:
      type: object
      required: [attemptId, totalScore, maxScore, percentage, validated]
      properties:
        attemptId: { type: string }
        totalScore: { type: number }
        maxScore: { type: number }
        percentage: { type: number }
        validated: { type: boolean }
    PublicInvitation:
      type: object
      required: [candidateFirstName, candidateLastName, companyName, campaignTitle, durationMinutes, questionCount, closesAt, status]
      properties:
        candidateFirstName: { type: string }
        candidateLastName: { type: string }
        companyName: { type: string }
        campaignTitle: { type: string }
        durationMinutes: { type: integer }
        questionCount: { type: integer }
        closesAt: { type: string, format: date-time }
        status: { type: string }
    IdentityCheck:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
    AssessmentAttempt:
      type: object
      required: [id, startedAt, deadlineAt, secondsRemaining, questions]
      properties:
        id: { type: string }
        startedAt: { type: string, format: date-time }
        deadlineAt: { type: string, format: date-time }
        secondsRemaining: { type: integer }
        questions:
          type: array
          items: { $ref: "#/components/schemas/PublicQuestion" }
    PublicQuestion:
      type: object
      required: [id, prompt, kind, points, required]
      properties:
        id: { type: string }
        prompt: { type: string }
        kind: { type: string }
        points: { type: number }
        required: { type: boolean }
        choices: { type: array, items: { type: string } }
        maxCharacters: { type: ["integer", "null"] }
        answer: { type: ["string", "null"] }
    AnswerInput:
      type: object
      required: [value]
      properties:
        value: { type: string }
    SavedAnswer:
      type: object
      required: [savedAt]
      properties:
        savedAt: { type: string, format: date-time }
    Submission:
      type: object
      required: [submittedAt, type]
      properties:
        submittedAt: { type: string, format: date-time }
        type: { type: string, enum: [voluntary, automatic] }

