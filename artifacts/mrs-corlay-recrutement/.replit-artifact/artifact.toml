kind = "web"
previewPath = "/"
title = "Recrutement MRS & CORLAY"
description = "Plateforme RH sécurisée pour gérer les campagnes de recrutement de MRS et CORLAY, inviter et évaluer les candidats, corriger les épreuves et suivre la présélection."
version = "1.0.0"
id = "artifacts/mrs-corlay-recrutement"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19059

[services.development]
run = "pnpm --filter @workspace/mrs-corlay-recrutement run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mrs-corlay-recrutement", "run", "build" ]
serve = "static"
publicDir = "artifacts/mrs-corlay-recrutement/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19059"
BASE_PATH = "/"
